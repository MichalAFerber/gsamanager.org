url: "https://gsamanager.org"
# Empty on purpose, and explicit. jekyll-github-metadata fills `baseurl` in from
# the repository whenever it is nil or "/" — which is how every URL on this site,
# canonical included, once acquired a /pages/<owner>/<repo>/ prefix. A written-down
# empty value is not nil, so nothing can fill it in.
baseurl: ""
title: GSA Manager
description: All-in-one point of sale, inventory, CRM, and task management software for associations, clubs, and small businesses.
og_image: /og.png

# Social/SEO image (used by jekyll-seo-tag for og:image)
defaults:
  - scope:
      path: ""
    values:
      # jekyll-seo-tag emits og:image:width/height only when `image` is given in
      # object form. Dimensions are the file's real ones (1410x635), not the
      # 1200x630 convention — scrapers reserve layout from these before fetching,
      # so a wrong value is worse than none.
      image:
        path: /og.png
        width: 1200
        height: 630
  # The /install/ directory is a ClickOnce download landing page. It is
  # blocked in robots.txt and the index page is a redirect, so keep it out
  # of the sitemap to avoid "Page with redirect" / "Blocked by robots.txt"
  # signals in Google Search Console.
  - scope:
      path: "install"
    values:
      sitemap: false

# Contact routing. The site key is public — it ships in the page — but the
# secret it pairs with lives only on the mailer. mailer_product is the herald
# registry slug that selects the from address, recipient, Origin allowlist and
# Turnstile secret; it must match the row for `gsamanager_org`.
turnstile_sitekey: "0x4AAAAAAD-B7hIU5QqSXReP"
support_email: "michal@gsamanager.org"
mailer_product: "gsamanager_org"

remote_theme: pages-themes/cayman@v0.2.0
repository: MichalAFerber/gsamanager.org


# Navigation

# Search

# Footer


# Heading anchor links

# External links open in new tab
plugins:
  - jekyll-remote-theme
  # cayman's layout renders site.github.* in its header and footer.
  - jekyll-github-metadata
  # Was active via the github-pages gem's default set, never listed here.
  # The source writes links relative (install/publish.htm); this is what turns
  # them into /install/publish.htm.
  - jekyll-relative-links
  - jekyll-target-blank
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - .well-known
